# KataGo analysis-engine config for raw HumanSL policy extraction (RESULTS A-039).
# Derived from KataGo v1.18.2 analysis_example.cfg. One visit per position: the
# reported policy is the raw network output for the query's humanSLProfile.

logFile = outputs/humansl_logs/katago.log
logToStderr = false
reportAnalysisWinratesAs = BLACK
wideRootNoise = 0.0
# Humans condition on recent moves; keep the real move history.
ignorePreRootHistory = false

maxVisits = 1
numAnalysisThreads = 256
numSearchThreadsPerAnalysisThread = 1
nnMaxBatchSize = 256
# Every query position is new; a small cache only wastes memory.
nnCacheSizePowerOfTwo = 16
nnMutexPoolSizePowerOfTwo = 12
# Fixed identity orientation so repeated runs give identical policies.
nnRandomize = false
